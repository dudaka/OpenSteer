[package]
name = "steerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
steer-demos = { path = "../steer-demos" }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"

[lints]
workspace = true
